name: G2B 통합 수집

on:
  workflow_dispatch:
    inputs:
      job:
        description: "실행 작업"
        required: true
        type: choice
        default: daily
        options:
          - daily            # announcement + bid-result(병렬) → extras → opening → pdf-region → audit 순차 (cron 동일)
          - announcement     # 공고 신규만
          - bid-result       # 낙찰 결과 신규만 (2026-05-14 분리 — announcement timeout 회피)
          - extras           # 보조정보 v2 (bulk-extras.yml)
          - opening          # 개찰결과 (bulk-opening.yml)
          - pdf-region       # 활성 공고 PDF/HWP 자격 추출 (pdfRgnLimit)
          - reparse          # rawJson 재파싱 (reparse-rawjson.yml)
          - avalue           # A값 백필 (완료, 수동만)
          - import           # 전체 역대 (완료, 수동만)
          - recollect-openedat  # BidResult.openedAt 결측 보강 (rlOpengDt 재수집)
          - recollect        # H-6 옵션 A — 매칭률 <25% 17개월 + 시범 200703 (3단계 분리 + 보조 API + reparse)
          - audit            # 데이터 품질 감사 단독 실행
      from:
        description: "시작월/시작일 (YYYYMM 또는 YYYYMMDD)"
        required: false
        default: ""
      to:
        description: "종료월/종료일 (YYYYMM 또는 YYYYMMDD)"
        required: false
        default: ""
      months:
        description: "recollect 대상 월 (콤마 분리 YYYYMM, 비우면 H-6 기본 18개월)"
        required: false
        default: ""
      with_extras:
        description: "recollect 후 보조 API + reparse 자동 실행"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 14 * * *"   # 매일 KST 23:00 — daily (announcement → extras → opening 순차)

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.0.0"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.set.outputs.job }}
      from: ${{ steps.set.outputs.from }}
      to: ${{ steps.set.outputs.to }}
      months: ${{ steps.set.outputs.months }}
      with_extras: ${{ steps.set.outputs.with_extras }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "job=daily" >> $GITHUB_OUTPUT
          else
            echo "job=${{ github.event.inputs.job }}" >> $GITHUB_OUTPUT
          fi
          echo "from=${{ github.event.inputs.from }}" >> $GITHUB_OUTPUT
          echo "to=${{ github.event.inputs.to }}" >> $GITHUB_OUTPUT
          echo "months=${{ github.event.inputs.months }}" >> $GITHUB_OUTPUT
          echo "with_extras=${{ github.event.inputs.with_extras }}" >> $GITHUB_OUTPUT

  announcement:
    needs: setup
    if: needs.setup.outputs.job == 'announcement' || needs.setup.outputs.job == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: 공고 신규 수집 (Announcement)
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FROM="${{ needs.setup.outputs.from }}"
          if [ -z "$FROM" ]; then FROM=$(date -d '30 days ago' +%Y%m%d); fi
          TO="${{ needs.setup.outputs.to }}"
          CMD="pnpm ts-node src/index.ts --type announcement --pages 999 --from $FROM"
          if [ -n "$TO" ]; then CMD="$CMD --to $TO"; fi
          echo "실행: $CMD"
          eval $CMD
      - name: 부종공종 채우기
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm ts-node src/index.ts --type fill-sub
      - name: A값 채우기
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm ts-node src/index.ts --type fill-avalue

  bid-result:
    needs: setup
    if: needs.setup.outputs.job == 'bid-result' || needs.setup.outputs.job == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: 낙찰 결과 신규 수집 (BidResult) — 2026-05-14 announcement 와 분리
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FROM="${{ needs.setup.outputs.from }}"
          if [ -z "$FROM" ]; then FROM=$(date -d '30 days ago' +%Y%m%d); fi
          TO="${{ needs.setup.outputs.to }}"
          CMD="pnpm ts-node src/index.ts --type bid-result --pages 999 --from $FROM"
          if [ -n "$TO" ]; then CMD="$CMD --to $TO"; fi
          echo "실행: $CMD"
          eval $CMD

  extras:
    needs: [setup, announcement]
    if: |
      always() &&
      (needs.setup.outputs.job == 'extras' || needs.setup.outputs.job == 'daily') &&
      (needs.announcement.result == 'success' || needs.announcement.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @naktal/db exec prisma generate
      - name: 보조정보 v2 수집
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: |
          if [ "${{ needs.setup.outputs.job }}" = "daily" ]; then
            FROM=$(date -d "1 day ago" +%Y%m)
            TO=$(date +%Y%m)
          else
            FROM="${{ needs.setup.outputs.from }}"
            TO="${{ needs.setup.outputs.to }}"
            if [ -z "$FROM" ]; then FROM="200201"; fi
            if [ -z "$TO" ]; then TO=$(date +%Y%m); fi
          fi
          echo "실행: pnpm ts-node src/bulk-import-extras-v2.ts --from=$FROM --to=$TO"
          pnpm ts-node src/bulk-import-extras-v2.ts --from=$FROM --to=$TO

  opening:
    needs: [setup, extras]
    if: |
      always() &&
      (needs.setup.outputs.job == 'opening' || needs.setup.outputs.job == 'daily') &&
      (needs.extras.result == 'success' || needs.extras.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @naktal/db exec prisma generate
      - name: 개찰결과 bulk 수집
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: |
          if [ "${{ needs.setup.outputs.job }}" = "daily" ]; then
            FROM=$(date -d "1 day ago" +%Y%m)
            TO=$(date +%Y%m)
          else
            FROM="${{ needs.setup.outputs.from }}"
            TO="${{ needs.setup.outputs.to }}"
            if [ -z "$FROM" ]; then FROM="200201"; fi
            if [ -z "$TO" ]; then TO=$(date +%Y%m); fi
          fi
          echo "실행: pnpm ts-node src/bulk-opening.ts --from=$FROM --to=$TO"
          pnpm ts-node src/bulk-opening.ts --from=$FROM --to=$TO

  pdf-region:
    needs: [setup, announcement]
    if: |
      always() &&
      (needs.setup.outputs.job == 'daily' || needs.setup.outputs.job == 'pdf-region') &&
      (needs.announcement.result == 'success' || needs.announcement.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - name: 시스템 패키지 설치 (poppler-utils + pyhwp)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils python3-pip
          pip3 install --quiet pyhwp
          which pdftotext && which hwp5txt
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @naktal/db exec prisma generate
      - name: 신규 활성 공고 PDF/HWP 자격 추출 (pdfRgnLimit)
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ts-node src/scripts/backfill-pdf-region.ts --concurrency 4

  audit:
    needs: [setup, opening]
    if: |
      always() &&
      (needs.setup.outputs.job == 'daily' || needs.setup.outputs.job == 'audit') &&
      (needs.opening.result == 'success' || needs.opening.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @naktal/db exec prisma generate
      - name: 데이터 품질 감사 (채움율 + 샘플)
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ts-node src/scripts/audit-data-quality.ts

  fill-bid-results:
    needs: [setup, opening]
    if: |
      always() &&
      (needs.setup.outputs.job == 'daily' || needs.setup.outputs.job == 'fill-bid-results') &&
      (needs.opening.result == 'success' || needs.opening.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 의뢰 결과 자동 채우기 (개찰 후 BidRequest 갱신)
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://naktal.me' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET 미설정 — fill-bid-results 건너뜀"
            exit 0
          fi
          echo "마감 지난 BidRequest 결과 채우기 시작"
          RESPONSE=$(curl -s -X GET "$SITE_URL/api/cron/fill-bid-results" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "응답: $RESPONSE"
      - name: 사용자 순위·실투찰가 매칭 (OpengCompt + userRank)
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://naktal.me' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET 미설정 — refresh-outcomes 건너뜀"
            exit 0
          fi
          echo "OpengCompt 매칭 + userRank 채우기 시작 (최대 50건/회 × 6회 반복)"
          for i in $(seq 1 6); do
            RESPONSE=$(curl -s -X POST "$SITE_URL/api/admin/refresh-outcomes" \
              -H "Authorization: Bearer $CRON_SECRET")
            UPDATED=$(echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('updated', 0))" 2>/dev/null || echo "0")
            echo "  [$i] updated=$UPDATED"
            if [ "$UPDATED" = "0" ]; then break; fi
            sleep 5
          done

  prefill-predictions:
    needs: [setup, announcement]
    if: |
      always() &&
      (needs.setup.outputs.job == 'daily' || needs.setup.outputs.job == 'announcement') &&
      (needs.announcement.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 신규 공사 공고 자동 분석 (BidPricePrediction 적재)
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://naktal.me' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET 미설정 — prefill 건너뜀 (Vercel ENV 등록 필요)"
            exit 0
          fi
          echo "신규 공사 공고 자동 분석 시작 — BATCH_LIMIT 30 × 최대 30회 반복"
          TOTAL_FILLED=0
          TOTAL_SKIPPED=0
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s -X POST "$SITE_URL/api/cron/prefill-predictions" \
              -H "Authorization: Bearer $CRON_SECRET")
            FILLED=$(echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('filled', 0))" 2>/dev/null || echo "0")
            SKIPPED=$(echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('skipped', 0))" 2>/dev/null || echo "0")
            TOTAL_FILLED=$((TOTAL_FILLED + FILLED))
            TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
            echo "  [$i] filled=$FILLED skipped=$SKIPPED (누적 filled=$TOTAL_FILLED)"
            if [ "$FILLED" = "0" ]; then
              echo "  완료 — 더 이상 미분석 공고 없음"
              break
            fi
            sleep 5
          done
          echo "총 분석 완료: $TOTAL_FILLED 건 (스킵 $TOTAL_SKIPPED 건)"

  recollect:
    needs: setup
    if: needs.setup.outputs.job == 'recollect'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @naktal/db exec prisma generate
      - name: H-6 재수집 (3단계 분리 — 모집 → 분석 → 적재)
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          MONTHS: ${{ needs.setup.outputs.months }}
        run: pnpm ts-node src/scripts/run-all-recollect.ts
      - name: H-6 후속 — 보조 API + reparse (with_extras=true 시)
        if: needs.setup.outputs.with_extras != 'false'
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: pnpm ts-node src/scripts/run-extras-recollect.ts
      - name: H-6 검증 — verify-totalcount 재실행 (재수집 월 매칭률 확인)
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: pnpm ts-node src/scripts/verify-totalcount.ts || true

  recollect-openedat:
    needs: setup
    if: needs.setup.outputs.job == 'recollect-openedat'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: BidResult.openedAt 결측 재수집 (SCSBID rlOpengDt)
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: pnpm ts-node src/scripts/recollect-bidresult-rlopeng.ts

  reparse:
    needs: setup
    if: needs.setup.outputs.job == 'reparse'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: rawJson 재파싱
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FROM="${{ needs.setup.outputs.from }}"
          TO="${{ needs.setup.outputs.to }}"
          if [ -z "$FROM" ]; then FROM="200201"; fi
          if [ -z "$TO" ]; then TO=$(date +%Y%m); fi
          echo "실행: pnpm ts-node src/scripts/reparse-rawjson.ts --from=$FROM --to=$TO"
          pnpm ts-node src/scripts/reparse-rawjson.ts --from=$FROM --to=$TO

  avalue:
    needs: setup
    if: needs.setup.outputs.job == 'avalue'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: A값 백필
        working-directory: apps/crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KONEPS_API_KEY: ${{ secrets.KONEPS_API_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: |
          FROM="${{ needs.setup.outputs.from }}"
          TO="${{ needs.setup.outputs.to }}"
          if [ -z "$FROM" ]; then FROM="200201"; fi
          if [ -z "$TO" ]; then TO="201412"; fi
          echo "실행: pnpm ts-node src/bulk-avalue-backfill.ts --from=$FROM --to=$TO"
          pnpm ts-node src/bulk-avalue-backfill.ts --from=$FROM --to=$TO

  import:
    needs: setup
    if: needs.setup.outputs.job == 'import'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "9.0.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: 전체 역대 수집
        working-directory: apps/crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          G2B_ANNOUNCE_KEY: ${{ secrets.G2B_API_KEY }}
        run: |
          FROM="${{ needs.setup.outputs.from }}"
          TO="${{ needs.setup.outputs.to }}"
          if [ -z "$FROM" ]; then FROM="201201"; fi
          if [ -z "$TO" ]; then TO=$(date +%Y%m); fi
          echo "실행: pnpm ts-node src/bulk-import.ts --from $FROM --to $TO"
          pnpm ts-node src/bulk-import.ts --from $FROM --to $TO
