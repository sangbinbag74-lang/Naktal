name: AI 예측 자동 채움

on:
  schedule:
    - cron: "0 * * * *"  # 매시간 정각 (UTC)
  workflow_dispatch:

jobs:
  prefill:
    runs-on: ubuntu-latest
    # 백로그(미분석 공고 누적) 처리 시 회차당 90~120초 → 5분 timeout 취소되던 문제 (2026-07-10 실측).
    # 15분으로 늘리고 filled=0 이면 조기 종료 (백로그 없는 평시엔 1~2회차에 끝남).
    timeout-minutes: 15
    steps:
      - name: Trigger prefill-predictions
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::warning::CRON_SECRET 미설정 — 건너뜀"; exit 0
          fi
          for i in $(seq 1 8); do
            echo "=== 회차 $i ==="
            RESP=$(curl -X POST https://naktal.me/api/cron/prefill-predictions \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              --max-time 120 -s -w "\n__HTTP__%{http_code}")
            CODE=$(echo "$RESP" | sed -n 's/.*__HTTP__//p')
            BODY=$(echo "$RESP" | sed 's/__HTTP__[0-9]*$//')
            FILLED=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('filled',0))" 2>/dev/null || echo "0")
            echo "HTTP $CODE | filled=$FILLED"
            if [ "$CODE" != "200" ]; then echo "::warning::HTTP $CODE — 중단"; break; fi
            if [ "$FILLED" = "0" ]; then echo "미분석 공고 없음 — 완료"; break; fi
            sleep 5
          done
